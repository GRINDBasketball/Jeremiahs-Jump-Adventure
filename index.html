                                     sp        pp                               sp           BBB", "  P       E      E          E  E        E   E        pp E   E  pp E                   E     E   pp          BBBB     F", "######################   #########   ##########   #####################   ####################################################", "######################   #########   ##########   #####################   ####################################################"], ["", "", "", "", "", "                                              o o                                                         o o", "      M?                B?B?B                 BBBB                      BBB             B?B               BBBB     B", "                   o o                                       oo   sp             o o                              BB", "            sp                        sp                          pp          sp                    sp           BBB", "  P         pp  E         E   E   E   pp        E   E   E         pp  E   E   pp          E   E   E pp  E       BBBB     F", "###################   ###################   #################  ##################   ##############################################", "###################   ###################   #################  ##################   ##############################################"], ["##############################################################################", "                                                                g", "                                                                g", "                                                                g", "                                                                g", "                                                                g", "      ?M?          o o o       BB?BB                            g", "                                                                g", "                                        BB for(let i=i0;i<=i1;i++)for(let j=0;j<12;j++){const c=tiles[i+','+j];if(c)drawTile(c,i,j,i*T,j*T,bl)}
if(prin){princessDraw(prin.x+15,prin.y+prin.h,1);if(!freed){x.strokeStyle='#bbb';x.lineWidth=3;for(let k=-20;k<=20;k+=8){x.beginPath();x.moveTo(prin.x+15+k,prin.y-14);x.lineTo(prin.x+15+k,prin.y+prin.h);x.stroke()}x.fillStyle='#888';x.fillRect(prin.x-8,prin.y-18,46,6)}
else if(st=='play')txt('Help!',prin.x+15,prin.y-24+Math.sin(tick/8)*3,18,'#ffd700')}
for(const c of coins)star(c.x,c.y+Math.sin(tick/8+c.x)*3,11,'#ffd700');
for(const c of fc){if(c.t>600&&tick%8<4)continue;const w=Math.abs(Math.cos(c.t/4))*8+1;x.fillStyle='#b8860b';x.beginPath();x.ellipse(c.x+8,c.y+8,w+1,9,0,0,7);x.fill();x.fillStyle='#ffd700';x.beginPath();x.ellipse(c.x+8,c.y+8,w,8,0,0,7);x.fill()}
for(const it of items){x.fillStyle='#f3e0c0';x.fillRect(it.x+8,it.y+14,12,14);x.fillStyle='#e01e1e';x.beginPath();x.ellipse(it.x+14,it.y+14,16,13,0,Math.PI,0);x.fill();x.fillRect(it.x-2,it.y+12,32,4);circ(it.x+6,it.y+6,3.5,'#fff');circ(it.x+20,it.y+5,4,'#fff');circ(it.x+14,it.y+11,2.5,'#fff');x.fillStyle='#000';x.fillRect(it.x+10,it.y+18,2,4);x.fillRect(it.x+16,it.y+18,2,4)}
for(const p of parts)star(p.x,p.y,p.c=='#ffd700'?13:6,p.c);
if(flagX<1e9){x.fillStyle='#eee';x.fillRect(flagX+16,4*T,6,6*T);x.fillStyle='#7fff00';x.beginPath();x.moveTo(flagX+22,4*T);x.lineTo(flagX+62,4*T+18);x.lineTo(flagX+22,4*T+36);x.fill();star(flagX+19,4*T-6,10,'#ffd700')}
for(const e of ens)e.k=='c'?chomper(e):skel(e);
for(const b of birds)bird(b);
for(const b of breath){x.fillStyle='#ff3300';x.beginPath();x.ellipse(b.x+11,b.y+7,13,8,0,0,7);x.fill();circ(b.x+11+Math.sign(b.vx)*4,b.y+7,5,'#ffd000')}
for(const f of fbs){circ(f.x,f.y,f.r+1,bl?'#c81e00':'#ff5a00');circ(f.x,f.y,f.r-3,'#ffe066')}
if((st=='play'||st=='clear')&&!(inv&&tick%8<4))hero();
x.restore();hud();
if(st=='clear'){x.fillStyle='rgba(42,8,69,.55)';x.fillRect(0,0,vw,480);txt('CASTLE '+(lvl+1)+' CLEARED!',vw/2,200,52);txt('★ '+score,vw/2,260,34,'#fff')}
if(st=='over'){x.fillStyle='rgba(42,8,69,.75)';x.fillRect(0,0,vw,480);txt('GAME OVER',vw/2,170,64,'#ff4fa0');txt('Stars: '+score,vw/2,240,34,'#fff');txt('Nice try, '+nm_()+'! Try '+LVN[lvl]+' again!',vw/2,290,26)}}
function drawMap(){const vw=W/S;sky('#5b1a8f','#c37be8');hills('#3a8f3a',0);x.fillStyle='#3cb93c';x.fillRect(0,290,vw,190);x.fillStyle='#6b3a1f';x.fillRect(0,304,vw,176);
txt('World Map',vw/2,44,38,'#fff');txt(lvl==0?'King Scorch took Princess Star! Save her!':'Next stop: '+LVN[lvl]+'!',vw/2,84,lvl==0?26:30,'#ffd700');
const gap=vw/5.3,xs=[0,1,2,3,4].map(i=>gap*(i+.75)+(i==4?gap*.15:0));
x.strokeStyle='#fff';x.lineWidth=4;x.setLineDash([10,10]);x.beginPath();x.moveTo(xs[0],284);x.lineTo(xs[4],284);x.stroke();x.setLineDash([]);
const cols=['#f2e6ff','#ffe9d6','#e6f7ff','#fff6cc'];
for(let i=0;i<5;i++){const d=i==4;castle(xs[i],290,d?1.15:.85,d?'#2b2233':cols[i],d?'#ff4d00':(i<lvl?'#7fff00':'#e01e1e'),d);
txt(d?'King Scorch':'Castle '+(i+1),xs[i],330,d?18:18,d?'#ff9a1f':'#fff');
if(i<lvl){circ(xs[i]+34,178,14,'#3cb93c');txt('✓',xs[i]+34,186,22,'#fff')}}
txt('▼',xs[lvl],120+Math.sin(tick/8)*5,28,'#7fff00');
heroDraw(xs[lvl]-(lvl==4?84:62),290-Math.abs(Math.sin(tick/10))*10,1,1.2,{});}
function drawEnding(t,quiet){const vw=W/S;sky('#7fc8ff','#fff3c4');circ(80,80,36,'#fff59a');hills('#3a8f3a',0);x.fillStyle='#3cb93c';x.fillRect(0,400,vw,80);x.fillStyle='#6b3a1f';x.fillRect(0,414,vw,66);
const cx=vw-170;castle(cx,400,1.6,'#fdf6ff','#e01e1e');
const hx=Math.min(40+t*1.7,cx-70),walking=hx<cx-70;
heroDraw(hx,400,1,1.3,{carry:1,run:walking});princessDraw(hx,343,1);
if(!walking)for(let i=0;i<4;i++){const hy=330-((t*1.2+i*40)%160);x.globalAlpha=Math.max(0,1-(330-hy)/160);heart(hx-20+i*14,hy,8,'#ff4fa0')}x.globalAlpha=1;
if(!quiet)txt(t<220?nm_()+' saved Princess Star!':'Home to the castle! Hooray!',vw/2,70,32,'#e01e1e')}
function draw(){x.setTransform(1,0,0,1,0,0);x.setTransform(S,0,0,S,0,0);const vw=W/S;
if(st=='title'){sky('#5b1a8f','#c37be8');hills('#3a8f3a',tick);txt("Jeremiah's",vw/2,110,48);txt("Jump Adventure!",vw/2,165,52,'#fff');txt('Hi '+nm_()+'!',vw/2,215,32,'#ffd700');
heroDraw(vw/2-40,320+Math.sin(tick/8)*6,1,1.3,{});princessDraw(vw/2+40,320,1.2);txt('Stomp bad guys • Shoot fireballs • Save Princess Star!',vw/2,345,20,'#fff');txt('Keys: ← → move • Space jump • F or X fire',vw/2,462,16,'#fff');return}
if(st=='map')return drawMap();
if(st=='ending')return drawEnding(et);
if(st=='win'){drawEnding(460,1);x.fillStyle='rgba(42,8,69,.6)';x.fillRect(0,0,vw,480);for(const c of conf){c.y+=c.v;if(c.y>480)c.y=-10;x.fillStyle=c.c;x.fillRect(c.x*vw/800,c.y,8,12)}
txt('YOU SAVED',vw/2,140,54,'#fff');txt('PRINCESS STAR!',vw/2,200,58,'#ffd700');txt('Thank you, '+nm_()+'!  ★ '+score,vw/2,260,30,'#7fff00');return}
drawLevel()}
const pad=document.getElementById('pad');
function loop(){if(!(typeof bagPanel!=='undefined'&&bagPanel.style.display==='flex'))upd();draw();const want=st=='play'?'flex':'none';if(pad.style.display!=want)pad.style.display=want;if(typeof syncBag==='function')syncBag();requestAnimationFrame(loop)}
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j',f:'f',F:'f',x:'f',X:'f'};
addEventListener('keydown',e=>{if(document.activeElement==ni)return;const k=km[e.key];if(k){K[k]=1;e.preventDefault()}if(e.key=='Enter'&&eb.style.display=='block'&&nm.style.display=='none')eb.click()});
addEventListener('keyup',e=>{const k=km[e.key];if(k)K[k]=0});
[['bl','l'],['br','r'],['bj','j'],['bf','f']].forEach(([id,k])=>{const b=document.getElementById(id);
b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1});['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>K[k]=0))});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const nm=document.getElementById('nm'),eb=document.getElementById('eb');
const bagBtn=document.getElementById('bagBtn'),bagPanel=document.getElementById('bagPanel'),bagNote=document.getElementById('bagNote');
function bagWant(){return nm.style.display==='none'&&(st==='play'||st==='map'||st==='title')}
function syncBag(){const show=bagWant()&&bagPanel.style.display!=='flex';bagBtn.style.display=show?'block':'none'}
bagBtn.onclick=()=>{bp(523,.08);bagNote.style.display='none';bagPanel.style.display='flex';bagBtn.style.display='none'};
document.getElementById('bagSupport').onclick=()=>{bp(660,.08);bagNote.style.display='block'};
document.getElementById('bagClose').onclick=()=>{bp(440,.06);bagPanel.style.display='none';bagNote.style.display='none';syncBag()};
function go(){name=ni.value.trim().slice(0,12)||'Jeremiah';localStorage.setItem('jjName',name);nm.style.display='none';ni.blur();bp(660,.1);st='title';showB('PLAY')}
document.getElementById('go').onclick=go;ni.addEventListener('keydown',e=>{if(e.key=='Enter')go()});
eb.onclick=()=>{bp(784,.1);if(st=='title'||st=='win')newGame();else if(st=='map')startLevel(lvl);else if(st=='over'){score=lvlScore;startLevel(lvl)}};
loop();
